<title>美容ノート</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-title" content="美容ノート">
<meta name="theme-color" content="#FF3E6C">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700;900&family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
  :root{
    --bg:#EAF6FB; --surface:#FFFFFF; --surface-alt:#EEF5FA;
    --text:#26323C; --text-muted:#75858F;
    --accent:#FF3E6C; --accent-strong:#E01E52; --accent-soft:#FFE0EA; --accent-soft-text:#C41752;
    --accent2:#9B6BFF; --accent2-strong:#7C3FED;
    --gradient-brand:linear-gradient(135deg, var(--accent) 0%, var(--accent2) 100%);
    --streak:#2FA9DB; --streak-soft:#D2EEFA;
    --line:#DEE9F1;
    --good:#4E8F72; --good-soft:#DDEEE3;
    --warn:#B96A2E; --warn-soft:#F5E1CE;
    --muted-chip:#E6EFF5; --muted-chip-text:#66788A;
    --chip-skincare:#1B9C8C; --chip-haircare:#E39A2E; --chip-bodycare:#7C5FE0; --chip-makeup:#FF3E6C;
    --shadow:0 10px 26px -14px rgba(35,55,75,0.3);
    --shadow-sm:0 2px 8px -4px rgba(35,55,75,0.16);
    --shadow-glow:0 10px 24px -8px rgba(255,62,108,.45), 0 4px 14px -6px rgba(155,107,255,.4);
    --radius-card:16px; --radius-pill:999px; --radius-photo:20px;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#170B22; --surface:#241730; --surface-alt:#2C1C3A;
      --text:#FBF0F3; --text-muted:#BCA3C9;
      --accent:#FF6D93; --accent-strong:#FF3E6C; --accent-soft:#3D1C29; --accent-soft-text:#FFAAC1;
      --accent2:#C79CFF; --accent2-strong:#A96BFF;
      --gradient-brand:linear-gradient(135deg, var(--accent) 0%, var(--accent2) 100%);
      --streak:#5CC5EE; --streak-soft:#123544;
      --line:#3B2A4A;
      --good:#7FBF9B; --good-soft:#213329;
      --warn:#E0A05C; --warn-soft:#3E2E1C;
      --muted-chip:#2E2342; --muted-chip-text:#C6B4DD;
      --chip-skincare:#4FC7B6; --chip-haircare:#EBB458; --chip-bodycare:#A793F0; --chip-makeup:#FF6D93;
      --shadow:0 14px 30px -16px rgba(0,0,0,0.6);
      --shadow-sm:0 2px 10px -4px rgba(0,0,0,0.5);
      --shadow-glow:0 12px 28px -10px rgba(255,109,147,.5), 0 4px 16px -6px rgba(199,156,255,.45);
    }
  }
  :root[data-theme="dark"]{
    --bg:#170B22; --surface:#241730; --surface-alt:#2C1C3A;
    --text:#FBF0F3; --text-muted:#BCA3C9;
    --accent:#FF6D93; --accent-strong:#FF3E6C; --accent-soft:#3D1C29; --accent-soft-text:#FFAAC1;
    --accent2:#C79CFF; --accent2-strong:#A96BFF;
    --gradient-brand:linear-gradient(135deg, var(--accent) 0%, var(--accent2) 100%);
    --streak:#5CC5EE; --streak-soft:#123544;
    --line:#3B2A4A;
    --good:#7FBF9B; --good-soft:#213329;
    --warn:#E0A05C; --warn-soft:#3E2E1C;
    --muted-chip:#2E2342; --muted-chip-text:#C6B4DD;
    --chip-skincare:#4FC7B6; --chip-haircare:#EBB458; --chip-bodycare:#A793F0; --chip-makeup:#FF6D93;
    --shadow:0 14px 30px -16px rgba(0,0,0,0.6);
    --shadow-sm:0 2px 10px -4px rgba(0,0,0,0.5);
    --shadow-glow:0 12px 28px -10px rgba(255,109,147,.5), 0 4px 16px -6px rgba(199,156,255,.45);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg); color:var(--text);
    font-family:'Zen Maru Gothic','Manrope',system-ui,-apple-system,'Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif;
    font-size:15px; line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.disp{ font-family:'Zen Maru Gothic',system-ui,sans-serif; font-weight:700; text-wrap:balance; letter-spacing:-.01em; }
  .num{ font-variant-numeric:tabular-nums; }
  a{ color:inherit; }
  button{ font-family:inherit; }
  input,select,textarea{ font-family:inherit; font-size:15px; }

  .app{ max-width:920px; margin:0 auto; padding:0 16px 128px; }

  .topbar{
    position:sticky; top:0; z-index:20;
    background:var(--bg); padding:20px 16px 10px;
    max-width:920px; margin:0 auto;
  }
  .topbar-inner{ max-width:920px; margin:0 auto; }
  .brand{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin:0; }
  .brand h1{ font-size:23px; font-weight:900; margin:0; letter-spacing:.01em; display:flex; align-items:center; gap:4px; }
  .brand h1 .brand-text{
    background:var(--gradient-brand);
    -webkit-background-clip:text; background-clip:text;
    color:transparent; -webkit-text-fill-color:transparent;
  }
  .brand h1 .dot{ font-size:16px; transform:translateY(-4px); color:var(--accent2); }

  .streak-badge{
    display:flex; align-items:center; gap:5px; border:none; cursor:pointer;
    background:var(--streak-soft); color:var(--streak);
    border-radius:var(--radius-pill); padding:7px 13px 7px 10px;
    font-weight:800; font-size:14px; box-shadow:var(--shadow-sm);
  }
  .streak-badge.zero{ background:var(--muted-chip); color:var(--muted-chip-text); box-shadow:none; }
  .streak-flame{ font-size:15px; line-height:1; }

  .topbar-icon-btn{
    border:none; background:var(--surface); color:var(--text-muted);
    width:34px; height:34px; border-radius:50%; flex:none; box-shadow:var(--shadow-sm);
    display:flex; align-items:center; justify-content:center; cursor:pointer;
  }
  .topbar-icon-btn svg{ width:17px; height:17px; }
  .topbar-right{ display:flex; align-items:center; gap:8px; }

  button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible{
    outline:2px solid var(--accent); outline-offset:2px;
  }

  .panel{ display:none; }
  .panel.active{ display:block; }

  .streak-week{
    display:flex; gap:6px; margin-bottom:18px;
    overflow-x:auto; -webkit-overflow-scrolling:touch;
    scrollbar-width:none; -ms-overflow-style:none;
    scroll-snap-type:x proximity; padding-bottom:2px;
  }
  .streak-week::-webkit-scrollbar{ display:none; }
  .week-nav{ display:flex; justify-content:center; margin:-8px 0 14px; }
  .week-nav button{
    border:none; background:var(--muted-chip); color:var(--muted-chip-text);
    border-radius:var(--radius-pill); padding:6px 14px; font-size:12px; font-weight:700; cursor:pointer;
  }
  .day-pill{
    flex:0 0 46px; display:flex; flex-direction:column; align-items:center; gap:1px;
    padding:9px 0 8px; border-radius:16px; cursor:pointer; font-family:inherit;
    background:var(--surface); border:1.5px solid var(--line);
    transition:transform .12s ease; scroll-snap-align:end;
  }
  .day-pill:active{ transform:scale(.94); }
  .day-pill .day-wd{ font-size:10px; font-weight:700; color:var(--text-muted); line-height:1.3; }
  .day-pill .day-date{ font-size:13.5px; font-weight:800; color:var(--text); line-height:1.3; }
  .day-pill .day-mark{
    width:7px; height:7px; border-radius:50%; margin-top:4px;
    background:var(--line);
  }
  .day-pill.on{ background:var(--streak-soft); border-color:var(--streak); }
  .day-pill.on .day-date{ color:var(--streak); }
  .day-pill.on .day-mark{ background:var(--streak); box-shadow:0 0 6px var(--streak); }
  .day-pill.today{ border-color:var(--streak); border-width:2.5px; padding:8px 0 7px; }
  .day-pill.today .day-wd{ color:var(--streak); }

  .panel-head{ display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:14px; flex-wrap:wrap; }
  .panel-head h2{ font-size:20px; font-weight:600; margin:0; }

  .bottom-nav{
    position:fixed; left:0; right:0; bottom:0; z-index:30;
    display:flex; justify-content:center; pointer-events:none;
    padding:0 16px calc(14px + env(safe-area-inset-bottom));
  }
  .bottom-nav-inner{
    pointer-events:auto; width:100%; max-width:420px;
    background:var(--surface); border:1px solid var(--line);
    border-radius:26px; box-shadow:var(--shadow);
    display:flex; align-items:center; justify-content:space-between; padding:7px 8px;
  }
  .tab-btn{
    flex:1; border:none; background:transparent; color:var(--text-muted);
    display:flex; flex-direction:column; align-items:center; gap:3px;
    padding:7px 2px; border-radius:16px; cursor:pointer;
    font-weight:700; font-size:10px; letter-spacing:.01em;
    transition:color .15s ease;
  }
  .tab-btn svg{ width:20px; height:20px; }
  .tab-btn.active{ color:var(--accent); }
  .fab{
    flex:0 0 auto; width:54px; height:54px; margin:0 6px; border-radius:50%;
    background:var(--gradient-brand); color:#fff; border:none; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    box-shadow:var(--shadow-glow);
    transform:translateY(-14px);
    animation:fabPulse 2.6s ease-in-out infinite;
  }
  .fab svg{ width:24px; height:24px; }
  .fab:hover{ filter:brightness(1.06); }
  .fab:active{ transform:translateY(-14px) scale(.94); }
  .fab[disabled]{ opacity:.4; cursor:not-allowed; animation:none; }
  @keyframes fabPulse{
    0%,100%{ box-shadow:var(--shadow-glow); }
    50%{ box-shadow:0 10px 30px -6px rgba(255,62,108,.65), 0 4px 20px -4px rgba(155,107,255,.55); }
  }

  .toolbar{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:16px; align-items:center; }
  .search-input{
    flex:1 1 180px; border:1px solid var(--line); background:var(--surface);
    border-radius:10px; padding:8px 12px; color:var(--text);
  }
  .chip-filter{
    display:flex; flex-wrap:wrap; gap:6px;
  }
  .chip-filter button{
    border:1px solid var(--line); background:var(--surface); color:var(--text-muted);
    border-radius:var(--radius-pill); padding:6px 13px; font-size:12.5px; font-weight:700; cursor:pointer;
  }
  .chip-filter button.active{ background:var(--gradient-brand); color:#fff; border-color:transparent; box-shadow:0 4px 10px -5px rgba(255,62,108,.5); }
  .chip-filter-sub{ margin-top:7px; }
  .chip-filter-sub button{ padding:5px 12px; font-size:11.5px; }
  .chip-filter-sub button.active{ background:var(--accent-soft); color:var(--accent-soft-text); border-color:var(--accent-soft); }
  .filter-label{ font-size:11px; font-weight:800; color:var(--text-muted); letter-spacing:.03em; margin:12px 0 6px; }
  .filter-label:first-of-type{ margin-top:2px; }
  .sort-select{
    border:1px solid var(--line); background:var(--surface); color:var(--text);
    border-radius:10px; padding:7px 10px; font-size:12.5px; font-weight:600;
  }

  .empty-state{
    text-align:center; padding:56px 20px; color:var(--text-muted);
  }
  .empty-state .disp{ font-size:18px; color:var(--text); margin-bottom:6px; }

  /* ---- log tab ---- */
  .log-list{ display:flex; flex-direction:column; gap:12px; }
  .log-card{
    background:var(--surface); border-radius:var(--radius-card);
    box-shadow:var(--shadow-sm); overflow:hidden; border:1px solid var(--line);
  }
  .log-photo{ width:100%; aspect-ratio:16/10; object-fit:cover; display:block; }
  .log-body{ padding:13px 15px 14px; }
  .log-head-row{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .time-chip{
    display:inline-block; font-size:11px; font-weight:700; padding:3px 10px;
    border-radius:var(--radius-pill); background:var(--accent-soft); color:var(--accent-soft-text);
  }
  .log-date-text{ font-weight:800; font-size:13.5px; }
  .mood-pill{
    display:inline-block; font-size:11px; font-weight:700; padding:3px 10px;
    border-radius:var(--radius-pill);
  }
  .log-head-row .card-actions{ margin-left:auto; }
  .log-items{ display:flex; flex-wrap:wrap; gap:5px; margin:8px 0 0; }
  .tag-chip{
    background:var(--muted-chip); color:var(--muted-chip-text); font-size:12px; font-weight:600;
    padding:3px 10px; border-radius:var(--radius-pill);
  }
  .log-memo{ font-size:13px; color:var(--text-muted); margin:7px 0 0; white-space:pre-wrap; }
  .card-actions{ display:flex; gap:4px; flex:0 0 auto; }
  .icon-btn{
    border:none; background:transparent; color:var(--text-muted); cursor:pointer;
    width:28px; height:28px; border-radius:8px; display:flex; align-items:center; justify-content:center;
    font-size:15px;
  }
  .icon-btn:hover{ background:var(--surface-alt); color:var(--text); }

  /* ---- item tab ---- */
  .item-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); gap:12px; }
  .item-card{
    background:var(--surface); border-radius:var(--radius-card); overflow:hidden;
    box-shadow:var(--shadow-sm); cursor:pointer; display:flex; flex-direction:column;
    border:1px solid var(--line);
  }
  .item-photo{
    aspect-ratio:1/1; background:var(--surface-alt); display:flex; align-items:center; justify-content:center;
    color:var(--text-muted); font-size:28px; overflow:hidden;
  }
  .item-photo img{ width:100%; height:100%; object-fit:cover; display:block; }
  .item-info{ padding:10px 12px 12px; display:flex; flex-direction:column; gap:5px; flex:1; }
  .item-chip-row{ display:flex; flex-wrap:wrap; gap:4px; }
  .item-genre-chip{
    font-size:10.5px; font-weight:800; letter-spacing:.03em;
    color:#fff; padding:2px 9px; border-radius:var(--radius-pill);
  }
  .item-subcat-chip{
    font-size:10.5px; font-weight:700;
    background:var(--muted-chip); color:var(--muted-chip-text); padding:2px 9px; border-radius:var(--radius-pill);
  }
  .item-name{ font-weight:700; font-size:13.5px; line-height:1.3; }
  .item-brand{ font-size:11.5px; color:var(--text-muted); }
  .status-row{ margin-top:auto; display:flex; align-items:center; gap:6px; }
  .status-chip{ font-size:10.5px; font-weight:700; padding:2px 9px; border-radius:var(--radius-pill); }
  .status-unopened{ background:var(--muted-chip); color:var(--muted-chip-text); }
  .status-inuse{ background:var(--good-soft); color:var(--good); }
  .status-used{ background:var(--surface-alt); color:var(--text-muted); }

  /* ---- lookbook tab ---- */
  .look-grid{ column-count:2; column-gap:12px; }
  @media (min-width:560px){ .look-grid{ column-count:3; } }
  .look-card{
    break-inside:avoid; margin-bottom:12px; background:var(--surface);
    border-radius:var(--radius-photo); overflow:hidden; box-shadow:var(--shadow-sm); cursor:pointer;
    border:1px solid var(--line);
  }
  .look-card img{ width:100%; display:block; }
  .look-meta{ padding:9px 11px 11px; }
  .look-cat{ font-size:10.5px; font-weight:800; color:var(--accent); letter-spacing:.03em; }
  .look-colors{ display:flex; flex-wrap:wrap; gap:4px; margin-top:5px; }
  .color-dot{ width:12px; height:12px; border-radius:50%; border:1px solid rgba(0,0,0,.15); }

  /* ---- modal ---- */
  .modal-overlay{
    display:none; position:fixed; inset:0; background:rgba(20,14,20,.5); z-index:100;
    align-items:flex-end; justify-content:center; padding:0;
  }
  .modal-overlay.show{ display:flex; }
  @media (min-width:640px){ .modal-overlay{ align-items:center; padding:20px; } }
  .modal{
    background:var(--surface); width:100%; max-width:520px; max-height:92vh; overflow-y:auto;
    border-radius:20px 20px 0 0; padding:22px 20px 28px;
  }
  @media (min-width:640px){ .modal{ border-radius:18px; } }
  .modal h3{ font-size:19px; font-weight:600; margin:0 0 16px; }
  .field{ margin-bottom:13px; }
  .field label{ display:block; font-size:12px; font-weight:700; color:var(--text-muted); margin-bottom:5px; letter-spacing:.02em; }
  .field input[type=text], .field input[type=date], .field input[type=number], .field textarea, .field select{
    width:100%; border:1px solid var(--line); background:var(--surface-alt); color:var(--text);
    border-radius:10px; padding:9px 11px;
  }
  .field textarea{ resize:vertical; min-height:60px; }
  .field-row{ display:flex; gap:10px; }
  .field-row > *{ flex:1; }
  .genre-pick, .mood-pick, .color-pick{ display:flex; flex-wrap:wrap; gap:6px; }
  .pick-btn{
    border:1.5px solid var(--line); background:var(--surface); color:var(--text);
    border-radius:var(--radius-pill); padding:7px 13px; font-size:12.5px; font-weight:700; cursor:pointer;
  }
  .pick-btn.sel{ border-color:var(--accent); background:var(--accent-soft); color:var(--accent-soft-text); }
  .color-pick .pick-btn{ display:flex; align-items:center; gap:6px; }
  .photo-drop{
    border:1.5px dashed var(--line); border-radius:14px; padding:16px; text-align:center;
    color:var(--text-muted); font-size:12.5px; cursor:pointer; position:relative;
  }
  .photo-drop img{ max-width:100%; max-height:180px; border-radius:10px; display:block; margin:0 auto; }
  .photo-drop input{ position:absolute; inset:0; opacity:0; cursor:pointer; }
  .modal-actions{ display:flex; gap:10px; margin-top:18px; }
  .btn-primary{
    flex:1; background:var(--gradient-brand); color:#fff; border:none; border-radius:14px;
    padding:12px; font-weight:800; font-size:14.5px; cursor:pointer;
    box-shadow:0 8px 18px -10px rgba(255,62,108,.55);
  }
  .btn-primary:hover{ filter:brightness(1.05); }
  .btn-ghost{
    background:transparent; border:1px solid var(--line); color:var(--text-muted);
    border-radius:12px; padding:12px 16px; font-weight:700; font-size:14.5px; cursor:pointer;
  }
  .btn-danger{ color:#B93A3A; }

  .lightbox{
    display:none; position:fixed; inset:0; background:rgba(10,7,10,.86); z-index:200;
    align-items:center; justify-content:center; padding:24px; flex-direction:column; gap:14px;
  }
  .lightbox.show{ display:flex; }
  .lightbox img{ max-width:100%; max-height:78vh; border-radius:12px; object-fit:contain; }
  .lightbox-info{ color:#fff; text-align:center; max-width:480px; font-size:13.5px; }
  .lightbox-close{ position:absolute; top:18px; right:18px; background:rgba(255,255,255,.15); color:#fff; border:none; width:36px; height:36px; border-radius:50%; font-size:18px; cursor:pointer; }

  .backup-note{ font-size:13px; color:var(--text-muted); margin:0 0 16px; line-height:1.6; }
  .backup-text{
    width:100%; font-size:10.5px; font-family:monospace; color:var(--text-muted);
    background:var(--surface-alt); border:1px solid var(--line); border-radius:10px; padding:8px;
  }
  .backup-section{ border-top:1px solid var(--line); margin-top:18px; padding-top:16px; }
  .backup-section label.field-label{ display:block; font-size:12px; font-weight:700; color:var(--text-muted); margin-bottom:8px; }
  .file-btn{ display:block; text-align:center; cursor:pointer; position:relative; overflow:hidden; }
  .file-btn input{ position:absolute; inset:0; opacity:0; cursor:pointer; }

  .hint{ font-size:11.5px; color:var(--text-muted); margin-top:4px; }

  @media (prefers-reduced-motion: reduce){ *{ transition:none !important; animation:none !important; } }
</style>

<div class="app">
  <div class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <h1><span class="brand-text">美容ノート</span><span class="dot">✳︎</span></h1>
        <div class="topbar-right">
          <button class="topbar-icon-btn" id="btnTheme" aria-label="ライト／ダークモード切り替え">
            <svg id="themeIconMoon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
            <svg id="themeIconSun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="display:none"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4l1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4m11.4-11.4l1.4-1.4"/></svg>
          </button>
          <button class="topbar-icon-btn" id="btnBackup" aria-label="データのバックアップ">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m0 0l-4-4m4 4l4-4"/><path d="M5 17v2a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-2"/></svg>
          </button>
          <button class="streak-badge zero" id="streakBadge"><span class="streak-flame">🔥</span><span id="streakCount" class="num">0</span></button>
        </div>
      </div>
    </div>
  </div>

  <!-- ===== 今日の記録 ===== -->
  <section class="panel active" id="panel-log">
    <div class="streak-week" id="streakWeek"></div>

<script>
(function(){
  "use strict";

  // ---------------- theme (light/dark) ----------------
  var THEME_KEY = "biyou-note-theme";
  function currentTheme(){
    var saved = null;
    try{ saved = localStorage.getItem(THEME_KEY); }catch(e){}
    if(saved === "light" || saved === "dark") return saved;
    return (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) ? "dark" : "light";
  }
  function applyTheme(theme){
    document.documentElement.setAttribute("data-theme", theme);
    var moon = document.getElementById("themeIconMoon");
    var sun = document.getElementById("themeIconSun");
    if(moon && sun){
      moon.style.display = theme === "dark" ? "none" : "";
      sun.style.display = theme === "dark" ? "" : "none";
    }
  }
  applyTheme(currentTheme());
  document.getElementById("btnTheme").addEventListener("click", function(){
    var next = currentTheme() === "dark" ? "light" : "dark";
    try{ localStorage.setItem(THEME_KEY, next); }catch(e){}
    applyTheme(next);
  });

  var GENRES = ["スキンケア","ヘアケア","ボディケア","メイク"];
  var GENRE_VAR = {"スキンケア":"--chip-skincare","ヘアケア":"--chip-haircare","ボディケア":"--chip-bodycare","メイク":"--chip-makeup"};
  var SUBCATS = {
    "スキンケア": ["クレンジング","洗顔","導入美容液","化粧水","美容液","乳液","クリーム","オイル","マスク"],
    "ヘアケア": ["シャンプー","コンディショナー","トリートメント","スクラブ","オイル","ミルク","ミスト","美容液"],
    "ボディケア": ["ボディソープ","スクラブ","ボディクリーム","ハンドクリーム"],
    "メイク": ["ベース","アイメイク","チーク","リップ"]
  };
  var LOOK_CATS = ["髪型","メイク","コスメ","その他"];
  var TIME_SLOTS = ["朝","昼","夜","メイク"];
  var COLOR_PRESETS = [
    ["ベージュ","#C9AE8C"],["ブラウン","#7B5236"],["レッド","#B23A3A"],["ピンク","#E497B0"],
    ["オレンジ","#D98A3D"],["イエロー","#E3C24A"],["グリーン","#6E9A6B"],["ブルー","#4C7EA8"],
    ["パープル","#8C6FB0"],["ブラック","#2A2130"],["ホワイト","#F5F0EE"],["ゴールド","#C6A24A"],["シルバー","#B8B8BC"],
    ["コーラル","#FF7F66"],["ボルドー","#6B1F2A"]
  ];
  var PERSONAL_COLORS = ["イエベ春","ブルベ夏","イエベ秋","ブルベ冬"];
  var SKELETON_TYPES = ["ウェーブ","ナチュラル","ストレート"];
  var SEASONS = ["春","夏","秋","冬"];
  var TEXTURES = ["透明感","ふんわり","カラーレス","スタイル","テーマ"];
  var MOODS = [
    {v:"絶好調",bg:"var(--good-soft)",fg:"var(--good)"},
    {v:"良い",bg:"var(--good-soft)",fg:"var(--good)"},
    {v:"ふつう",bg:"var(--muted-chip)",fg:"var(--muted-chip-text)"},
    {v:"やや不調",bg:"var(--warn-soft)",fg:"var(--warn)"},
    {v:"不調",bg:"var(--warn-soft)",fg:"var(--warn)"}
  ];

  var LS_KEY = "biyounote.v1";
  var LAST_BACKUP_KEY = "biyounote.lastBackup";
  var STATE = loadState();

  function loadState(){
    try{
      var raw = localStorage.getItem(LS_KEY);
      if(raw){
        var s = JSON.parse(raw);
        return { logs: s.logs||[], items: s.items||[], looks: s.looks||[] };
      }
    }catch(e){}
    return { logs: [], items: [], looks: [] };
  }
  function persist(){
    try{ localStorage.setItem(LS_KEY, JSON.stringify(STATE)); return true; }
    catch(e){ alert("保存に失敗しました。端末の空き容量を確認してください。"); return false; }
  }

  function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }

  function resizePhoto(file, maxDim, quality){
    return new Promise(function(resolve, reject){
      var reader = new FileReader();
      reader.onerror = reject;
      reader.onload = function(){
        var img = new Image();
        img.onerror = reject;
        img.onload = function(){
          var w = img.width, h = img.height;
          var scale = Math.min(1, maxDim / Math.max(w,h));
          var cw = Math.max(1, Math.round(w*scale)), ch = Math.max(1, Math.round(h*scale));
          var canvas = document.createElement("canvas");
          canvas.width = cw; canvas.height = ch;
          var ctx = canvas.getContext("2d");
          ctx.drawImage(img, 0, 0, cw, ch);
          resolve(canvas.toDataURL("image/jpeg", quality));
        };
        img.src = reader.result;
      };
      reader.readAsDataURL(file);
    });
  }

  var DATE_UNKNOWN = "不明";
  function fmtDate(iso){
    if(!iso) return "";
    if(iso === DATE_UNKNOWN) return DATE_UNKNOWN;
    var p = iso.split("-");
    return p[0]+"."+p[1]+"."+p[2];
  }
  function isoLocal(d){
    var p = function(n){ return (n<10?"0":"")+n; };
    return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate());
  }
  function logDateLabel(iso){
    var d = new Date(iso+"T00:00:00");
    var wd = ["日","月","火","水","木","金","土"][d.getDay()];
    return (d.getMonth()+1)+"月"+d.getDate()+"日（"+wd+"）";
  }
  function daysSince(iso){
    var d = new Date(iso+"T00:00:00"), now = new Date();
    return Math.floor((now - d) / 86400000);
  }
  // ---------------- read helpers ----------------
  function readLogs(){
    return STATE.logs.slice().sort(function(a,b){ return b.date.localeCompare(a.date) || b.id.localeCompare(a.id); });
  }
  function readItems(){
    return STATE.items.slice();
  }
  function normalizeLook(l){
    return {
      id: l.id,
      categories: l.categories || (l.category ? [l.category] : []),
      photo: l.photo || "",
      colors: l.colors || [],
      personalColors: l.personalColors || (l.personalColor ? [l.personalColor] : []),
      skeletons: l.skeletons || (l.skeleton ? [l.skeleton] : []),
      seasons: l.seasons || [],
      textures: l.textures || [],
      memo: l.memo || ""
    };
  }
  function readLooks(){
    return STATE.looks.map(normalizeLook);
  }

  // ---------------- tabs ----------------
  function activeTab(){
    var btn = document.querySelector(".tab-btn.active");
    return btn ? btn.dataset.tab : "log";
  }
  function switchTab(tab){
    document.querySelectorAll(".tab-btn").forEach(function(b){ b.classList.toggle("active", b.dataset.tab === tab); });
    document.querySelectorAll(".panel").forEach(function(p){ p.classList.remove("active"); });
    document.getElementById("panel-"+tab).classList.add("active");
  }
  document.querySelectorAll(".tab-btn").forEach(function(btn){
    btn.addEventListener("click", function(){ switchTab(btn.dataset.tab); });
  });
  document.getElementById("fabAdd").addEventListener("click", function(){
    var tab = activeTab();
    if(tab === "log") openLogModal(null);
    else if(tab === "items") openItemModal(null);
    else openLookModal(null);
  });
  document.getElementById("streakBadge").addEventListener("click", function(){
    switchTab("log");
    if(!readLogs().some(function(l){ return l.date === isoLocal(new Date()); })){ openLogModal(null); }
  });

  // ================= LOG TAB =================
  var logState = { editingId: null };

  function moodStyle(mood){
    for(var i=0;i<MOODS.length;i++){ if(MOODS[i].v === mood) return MOODS[i]; }
    return {v:mood, bg:"var(--muted-chip)", fg:"var(--muted-chip-text)"};
  }

  var STRIP_DAYS = 180; // 過去何日分をスクロール表示するか
  var stripInitialized = false;

  function renderStreak(logs){
    var days = {};
    logs.forEach(function(l){ days[l.date] = true; });
    var today = new Date(); today.setHours(0,0,0,0);
    var todayIso = isoLocal(today);
    var hasToday = !!days[todayIso];
    var cursor = new Date(today);
    if(!hasToday) cursor.setDate(cursor.getDate()-1);
    var streak = 0;
    while(days[isoLocal(cursor)]){ streak++; cursor.setDate(cursor.getDate()-1); }

    var badge = document.getElementById("streakBadge");
    badge.classList.toggle("zero", streak === 0);
    document.getElementById("streakCount").textContent = streak;

    var week = document.getElementById("streakWeek");
    var savedScroll = stripInitialized ? week.scrollLeft : null;
    week.innerHTML = "";
    var dow = ["日","月","火","水","木","金","土"];
    var frag = document.createDocumentFragment();
    for(var i=STRIP_DAYS-1;i>=0;i--){
      var d = new Date(today); d.setDate(d.getDate()-i);
      var iso = isoLocal(d);
      var pill = document.createElement("button");
      pill.type = "button";
      pill.className = "day-pill" + (days[iso] ? " on" : "") + (iso === todayIso ? " today" : "");
      var wdEl = document.createElement("span");
      wdEl.className = "day-wd"; wdEl.textContent = dow[d.getDay()];
      var dateEl = document.createElement("span");
      dateEl.className = "day-date num";
      dateEl.textContent = d.getDate() === 1 ? (d.getMonth()+1)+"/1" : d.getDate();
      var mark = document.createElement("span");
      mark.className = "day-mark";
      pill.appendChild(wdEl); pill.appendChild(dateEl); pill.appendChild(mark);
      pill.addEventListener("click", function(clickedIso){
        return function(){ openDayDetail(clickedIso); };
      }(iso));
      frag.appendChild(pill);
    }
    week.appendChild(frag);
    // 初回は右端（今日）を表示、再描画時はスクロール位置を維持する
    week.scrollLeft = savedScroll !== null ? savedScroll : week.scrollWidth;
    stripInitialized = true;
  }

  // 過去にスクロールしたら「今日にもどる」ボタンを出す
  (function(){
    var week = document.getElementById("streakWeek");
    var nav = document.getElementById("weekNav");
    week.addEventListener("scroll", function(){
      var fromRight = week.scrollWidth - week.clientWidth - week.scrollLeft;
      nav.style.display = fromRight > 80 ? "" : "none";
    }, {passive:true});
    document.getElementById("btnWeekToday").addEventListener("click", function(){
      week.scrollTo({left: week.scrollWidth, behavior: "smooth"});
    });
  })();

  function setupUnknownDateField(dateInputId, checkboxId, value){
    var dateInput = document.getElementById(dateInputId), checkbox = document.getElementById(checkboxId);
    var isUnknown = value === DATE_UNKNOWN;
    checkbox.checked = isUnknown;
    dateInput.disabled = isUnknown;
    dateInput.value = isUnknown ? "" : (value || "");
    checkbox.onchange = function(){
      dateInput.disabled = checkbox.checked;
      if(checkbox.checked) dateInput.value = "";
    };

  function setupPhotoDrop(dropId, hintId, inputId, maxDim, quality, initialPhoto){
    var drop = document.getElementById(dropId), hint = document.getElementById(hintId), input = document.getElementById(inputId);
    drop.querySelectorAll("img").forEach(function(i){ i.remove(); });
    input.value = "";
    var data = initialPhoto || null;
    if(initialPhoto){
      hint.style.display = "none";
      var img = document.createElement("img"); img.src = initialPhoto; drop.appendChild(img);
    } else {
      hint.style.display = "block";
    }
    input.onchange = async function(){
      var file = input.files[0];
      if(!file) return;
      hint.textContent = "処理中…";
      var dataUrl = await resizePhoto(file, maxDim, quality);
      data = dataUrl;
      drop.querySelectorAll("img").forEach(function(i){ i.remove(); });
      hint.style.display = "none";
      var img = document.createElement("img"); img.src = dataUrl; drop.appendChild(img);
    };
    return { get: function(){ return data; } };
  }

  function renderLookList(){
    var looks = readLooks();
    var q = document.getElementById("lookSearch").value.trim().toLowerCase();
    var f = lookState.filters;
    function overlaps(sel, vals){ return sel.length === 0 || vals.some(function(v){ return sel.indexOf(v) !== -1; }); }
    looks = looks.filter(function(l){
      return overlaps(f.cat, l.categories) &&
        overlaps(f.color, l.colors) &&
        overlaps(f.personalColor, l.personalColors) &&
        overlaps(f.skeleton, l.skeletons) &&
        overlaps(f.season, l.seasons) &&
        overlaps(f.texture, l.textures);
    });
    if(q){
      looks = looks.filter(function(l){
        var hay = [l.memo, l.categories.join(" "), l.personalColors.join(" "), l.skeletons.join(" "), l.seasons.join(" "), l.textures.join(" ")].join(" ").toLowerCase();
        return hay.indexOf(q) !== -1;
      });
    }
    looks.sort(function(a,b){ return b.id.localeCompare(a.id); });

    var view = document.getElementById("lookListView");
    view.innerHTML = "";
    if(looks.length === 0){
      view.innerHTML = '<div class="empty-state"><div class="disp">📸 写真がありません</div>お気に入りのヘア・メイクを記録しましょう</div>';

      card.querySelector(".look-cat").textContent = l.categories.join(" / ");
      var dots = card.querySelector(".look-colors");

        var preset = COLOR_PRESETS.filter(function(p){ return p[0]===cn; })[0];
        var dot = document.createElement("span");
        dot.className = "color-dot";
        dot.style.background = preset ? preset[1] : "var(--muted-chip)";
        dot.title = cn;
        dots.appendChild(dot);
      });
      card.addEventListener("click", function(){ openLightbox(l); });
      grid.appendChild(card);
    });
    view.appendChild(grid);
  }

  function openLightbox(l){
    document.getElementById("lightboxImg").src = l.photo;
    var infoParts = [];
    if(l.categories.length) infoParts.push(l.categories.join(" / "));
    if(l.personalColors.length) infoParts.push("パーソナルカラー: "+l.personalColors.join(" / "));
    if(l.skeletons.length) infoParts.push("骨格: "+l.skeletons.join(" / "));
    if(l.seasons.length) infoParts.push("季節: "+l.seasons.join(" / "));
    if(l.textures.length) infoParts.push("質感: "+l.textures.join(" / "));
    if(l.colors.length) infoParts.push("カラー: "+l.colors.join(" / "));
    var info = document.getElementById("lightboxInfo");
    info.innerHTML = "";
    infoParts.forEach(function(p){ var d = document.createElement("div"); d.textContent = p; info.appendChild(d); });
    if(l.memo){ var m = document.createElement("div"); m.style.marginTop="8px"; m.textContent = l.memo; info.appendChild(m); }
    var editBtn = document.createElement("button");
    editBtn.className = "btn-ghost"; editBtn.style.marginTop = "12px"; editBtn.style.color = "#fff"; editBtn.style.borderColor = "rgba(255,255,255,.4)";
    editBtn.textContent = "編集する";
    editBtn.addEventListener("click", function(){ closeLightbox(); openLookModal(l); });
    info.appendChild(editBtn);
    document.getElementById("lightbox").classList.add("show");
  }
  function closeLightbox(){ document.getElementById("lightbox").classList.remove("show"); }
  document.getElementById("lightboxClose").addEventListener("click", closeLightbox);
  document.getElementById("lightbox").addEventListener("click", function(e){ if(e.target.id === "lightbox") closeLightbox(); });

  var lookPhotoCtl = null;
  var lookCatCtl = null, lookColorCtl = null, lookPersonalColorCtl = null, lookSkeletonCtl = null, lookSeasonCtl = null, lookTextureCtl = null;
  var COLOR_MAP = {};
  COLOR_PRESETS.forEach(function(c){ COLOR_MAP[c[0]] = c[1]; });

  function openLookModal(l){
    lookState.editingId = l ? l.id : null;
    document.getElementById("modalLookTitle").textContent = l ? "写真を編集" : "写真を追加";
    lookCatCtl = buildMultiPicker(document.getElementById("fLookCat"), l ? l.categories : [], LOOK_CATS);
    lookColorCtl = buildMultiPicker(document.getElementById("fLookColors"), l ? l.colors : [], COLOR_PRESETS.map(function(c){return c[0];}), COLOR_MAP);
    lookPersonalColorCtl = buildMultiPicker(document.getElementById("fLookPersonalColor"), l ? l.personalColors : [], PERSONAL_COLORS);
    lookSkeletonCtl = buildMultiPicker(document.getElementById("fLookSkeleton"), l ? l.skeletons : [], SKELETON_TYPES);
    lookSeasonCtl = buildMultiPicker(document.getElementById("fLookSeason"), l ? l.seasons : [], SEASONS);
    lookTextureCtl = buildMultiPicker(document.getElementById("fLookTexture"), l ? l.textures : [], TEXTURES);
    document.getElementById("fLookMemo").value = l ? l.memo : "";
    lookPhotoCtl = setupPhotoDrop("lookPhotoDrop","lookPhotoHint","fLookPhotoInput", 900, 0.7, l ? l.photo : null);
    document.getElementById("btnLookDelete").style.display = l ? "block" : "none";
    document.getElementById("modalLook").classList.add("show");
  }
  function closeLookModal(){ document.getElementById("modalLook").classList.remove("show"); }

  document.getElementById("btnLookCancel").addEventListener("click", closeLookModal);
  document.getElementById("btnLookSave").addEventListener("click", async function(){
    var photo = lookPhotoCtl ? lookPhotoCtl.get() : null;
    if(!photo){ alert("写真を選択してください"); return; }
    var id = lookState.editingId || uid();
    var fields = {
      id: id,
      categories: lookCatCtl ? lookCatCtl.get() : [],
      photo: photo,
      colors: lookColorCtl ? lookColorCtl.get() : [],
      personalColors: lookPersonalColorCtl ? lookPersonalColorCtl.get() : [],
      skeletons: lookSkeletonCtl ? lookSkeletonCtl.get() : [],
      seasons: lookSeasonCtl ? lookSeasonCtl.get() : [],
      textures: lookTextureCtl ? lookTextureCtl.get() : [],
      memo: document.getElementById("fLookMemo").value.trim()
    };
    var idx = STATE.looks.findIndex(function(l){ return l.id === id; });
    if(idx === -1){ STATE.looks.push(fields); } else { STATE.looks[idx] = fields; }
    if(persist()){ closeLookModal(); renderLookList(); }
  });
  document.getElementById("btnLookDelete").addEventListener("click", function(){
    var id = lookState.editingId;
    if(!id || !confirm("この写真を削除しますか？")) return;
    STATE.looks = STATE.looks.filter(function(l){ return l.id !== id; });
    if(persist()){ closeLookModal(); renderLookList(); }
  });
  document.getElementById("lookSearch").addEventListener("input", renderLookList);

  // ---------------- backup / restore ----------------
  function renderLastBackupNote(){
    var el = document.getElementById("lastBackupNote");
    var iso = localStorage.getItem(LAST_BACKUP_KEY);
    if(!iso){ el.textContent = "まだバックアップを取っていません"; return; }
    var days = daysSince(iso);
    el.textContent = days <= 0 ? "最終バックアップ: 今日" : "最終バックアップ: " + days + "日前";
  }
  function markBackedUp(){
    try{ localStorage.setItem(LAST_BACKUP_KEY, isoLocal(new Date())); }catch(e){}
    renderLastBackupNote();
  }

  document.getElementById("btnBackup").addEventListener("click", function(){
    document.getElementById("backupFallback").style.display = "none";
    renderLastBackupNote();
    document.getElementById("modalBackup").classList.add("show");
  });
  document.getElementById("btnBackupClose").addEventListener("click", function(){
    document.getElementById("modalBackup").classList.remove("show");
  });
  document.getElementById("btnBackupSave").addEventListener("click", function(){
    var json = JSON.stringify(STATE);
    var filename = "美容ノート_" + isoLocal(new Date()).replace(/-/g,"") + ".json";
    var blob = new Blob([json], { type: "application/json" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(url); }, 2000);
    markBackedUp();
  });
  document.getElementById("btnBackupCopyToggle").addEventListener("click", function(){
    document.getElementById("backupText").value = JSON.stringify(STATE);
    document.getElementById("backupFallback").style.display = "block";
  });
  document.getElementById("btnBackupCopy").addEventListener("click", async function(){
    var ta = document.getElementById("backupText");
    ta.focus(); ta.select();
    try{ await navigator.clipboard.writeText(ta.value); markBackedUp(); alert("コピーしました"); }
    catch(e){ alert("自動コピーができませんでした。テキストを選択してコピーしてください。"); }
  });
  document.getElementById("fBackupRestore").addEventListener("change", function(){
    var file = this.files[0];
    if(!file) return;
    var reader = new FileReader();
    reader.onload = function(){
      try{
        var data = JSON.parse(reader.result);
        if(!confirm("この端末の現在のデータを、読み込んだバックアップで上書きします。よろしいですか？")) return;
        STATE = { logs: data.logs||[], items: data.items||[], looks: data.looks||[] };
        if(persist()){
          renderAll();
          document.getElementById("modalBackup").classList.remove("show");
          alert("復元しました");
        }
      }catch(e){ alert("ファイルの読み込みに失敗しました。正しいバックアップファイルか確認してください。"); }
    };
    reader.readAsText(file);
  });

  // ---------------- boot ----------------
  function renderAll(){
    renderLogList();
    renderItemList();
    renderLookList();
    refreshItemPlaceList();
  }

  function boot(){
    buildGenreFilterChips();
    buildSubcatFilterChips();
    buildLookCatFilter();
    buildLookColorFilter();
    buildLookPersonalColorFilter();
    buildLookSkeletonFilter();
    buildLookSeasonFilter();
    buildLookTextureFilter();
    renderAll();
    if(navigator.storage && navigator.storage.persist){
      navigator.storage.persist().catch(function(){});
    }
  }
  boot();
})();
</script>
