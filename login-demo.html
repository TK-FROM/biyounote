<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ログイン画面デザイン候補</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700;900&display=swap">
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  body{ font-family:'Zen Maru Gothic',system-ui,sans-serif; background:#F2F5F7; }
  .switcher{
    position:fixed; top:0; left:0; right:0; z-index:50;
    display:flex; gap:6px; padding:10px 12px; justify-content:center;
    background:rgba(255,255,255,.85); backdrop-filter:blur(8px);
    box-shadow:0 2px 10px -6px rgba(0,0,0,.2);
  }
  .switcher button{
    border:none; border-radius:999px; padding:8px 16px; font-family:inherit;
    font-size:13px; font-weight:800; cursor:pointer; background:#E9EEF2; color:#5A6B77;
  }
  .switcher button.active{ background:linear-gradient(135deg,#FF3E6C,#9B6BFF); color:#fff; }
  .scene{ display:none; min-height:100vh; position:relative; overflow:hidden;
    padding:80px 24px 40px; align-items:center; justify-content:center; }
  .scene.active{ display:flex; }
  .card-base{ position:relative; z-index:5; width:100%; max-width:330px; text-align:center; }
  .f-input{
    width:100%; font-family:inherit; font-size:15px; color:#26323C;
    padding:12px 14px; margin-bottom:10px;
  }
  .f-btn{
    width:100%; border:none; font-family:inherit; font-size:15px; font-weight:900;
    color:#fff; padding:13px; cursor:pointer;
    background:linear-gradient(135deg,#FF3E6C,#9B6BFF);
  }
  .logo-grad{
    background:linear-gradient(135deg,#FF3E6C,#9B6BFF);
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }

  /* ===== A: ゆめかわオーロラ ===== */
  #sceneA{ background:linear-gradient(160deg,#FFE9F3 0%,#EFE7FF 45%,#E0F3FF 100%); }
  .blob{ position:absolute; border-radius:50%; filter:blur(70px); opacity:.55; animation:blobFloat 9s ease-in-out infinite alternate; }
  .blob1{ width:300px; height:300px; background:#FFB3CE; top:-60px; left:-70px; }
  .blob2{ width:260px; height:260px; background:#C9B3FF; bottom:0; right:-60px; animation-delay:-3s; }
  .blob3{ width:220px; height:220px; background:#A8DDFF; bottom:-70px; left:10%; animation-delay:-6s; }
  @keyframes blobFloat{ from{ transform:translateY(0) scale(1); } to{ transform:translateY(28px) scale(1.08); } }
  .cardA{
    background:rgba(255,255,255,.55); backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px);
    border:1px solid rgba(255,255,255,.8); border-radius:28px; padding:34px 26px;
    box-shadow:0 20px 50px -20px rgba(155,107,255,.35);
  }
  .cardA h2{ font-size:26px; font-weight:900; margin-bottom:4px; }
  .cardA .sub{ font-size:12px; color:#8A7A96; margin-bottom:22px; }
  .cardA .f-input{ background:rgba(255,255,255,.85); border:1px solid rgba(255,255,255,.9); border-radius:16px; }
  .cardA .f-btn{ border-radius:999px; margin-top:6px; box-shadow:0 10px 22px -8px rgba(255,62,108,.5); }

  /* ===== B: きらきら夜空 ===== */
  #sceneB{ background:linear-gradient(170deg,#31184F 0%,#1B0F30 70%); }
  .star{ position:absolute; color:#E8D9FF; animation:twinkle 2.6s ease-in-out infinite; }
  @keyframes twinkle{ 0%,100%{ opacity:.15; transform:scale(.85); } 50%{ opacity:.95; transform:scale(1.1); } }
  .cardB{
    background:rgba(255,255,255,.07); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
    border:1px solid rgba(255,255,255,.16); border-radius:26px; padding:34px 26px;
  }
  .cardB h2{ font-size:26px; font-weight:900; margin-bottom:4px;
    background:linear-gradient(135deg,#FF8FB0,#C9A6FF);
    -webkit-background-clip:text; background-clip:text; color:transparent; }
  .cardB .moon{ font-size:30px; margin-bottom:8px; display:block; }
  .cardB .sub{ font-size:12px; color:#B9A6D6; margin-bottom:22px; }
  .cardB .f-input{ background:rgba(255,255,255,.1); border:1px solid rgba(255,255,255,.2); border-radius:14px; color:#fff; }
  .cardB .f-input::placeholder{ color:#9C87BF; }
  .cardB .f-btn{ border-radius:14px; margin-top:6px; box-shadow:0 0 26px -4px rgba(255,109,147,.55); }

  /* ===== C: すっきり水彩 ===== */
  #sceneC{ background:#FDFDFE; }
  .arcC1,.arcC2{ position:absolute; border-radius:50%; }
  .arcC1{ width:420px; height:420px; background:radial-gradient(circle at 30% 30%, rgba(255,179,206,.5), transparent 65%); top:-160px; right:-150px; }
  .arcC2{ width:460px; height:460px; background:radial-gradient(circle at 70% 70%, rgba(168,221,255,.55), transparent 65%); bottom:-190px; left:-160px; }
  .cardC h2{ font-size:32px; font-weight:900; margin-bottom:6px; }
  .cardC .dot{ color:#9B6BFF; font-size:20px; }
  .cardC .sub{ font-size:12.5px; color:#93A2AD; margin-bottom:34px; }
  .cardC .f-input{
    background:transparent; border:none; border-bottom:2px solid #E3EAF0; border-radius:0;
    padding:12px 4px; margin-bottom:16px;
  }
  .cardC .f-input:focus{ outline:none; border-bottom-color:#FF3E6C; }
  .cardC .f-btn{ border-radius:999px; margin-top:14px; box-shadow:0 12px 26px -10px rgba(255,62,108,.45); }

  /* ===== D: コスメポップ ===== */
  #sceneD{ background:linear-gradient(180deg,#EAF6FB 0%,#FDF0F6 100%); }
  .emo{ position:absolute; opacity:.75; animation:emoFloat 7s ease-in-out infinite alternate; }
  @keyframes emoFloat{ from{ transform:translateY(0) rotate(-6deg); } to{ transform:translateY(-24px) rotate(8deg); } }
  .cardD{
    background:#fff; border-radius:26px; padding:34px 26px;
    box-shadow:0 18px 44px -18px rgba(255,62,108,.3);
  }
  .cardD .face{ font-size:34px; display:block; margin-bottom:8px; }
  .cardD h2{ font-size:25px; font-weight:900; margin-bottom:4px; }
  .cardD .sub{ font-size:12px; color:#A08A9B; margin-bottom:20px; }
  .cardD .f-input{ background:#FFF3F8; border:2px solid #FFE0EC; border-radius:16px; }
  .cardD .f-input:focus{ outline:none; border-color:#FF8AC2; }
  .cardD .f-btn{ border-radius:16px; margin-top:6px; }
  .cardD .foot{ font-size:11px; color:#C6A9BB; margin-top:14px; }
</style>
</head>
<body>

<div class="switcher">
  <button class="active" onclick="show('A',this)">A ゆめかわ</button>
  <button onclick="show('B',this)">B 夜空</button>
  <button onclick="show('C',this)">C すっきり</button>
  <button onclick="show('D',this)">D ポップ</button>
</div>

<!-- A: ゆめかわオーロラ -->
<section class="scene active" id="sceneA">
  <div class="blob blob1"></div><div class="blob blob2"></div><div class="blob blob3"></div>
  <div class="card-base cardA">
    <h2 class="logo-grad">美容ノート ✳︎</h2>
    <p class="sub">じぶん磨きの記録をはじめよう</p>
    <input class="f-input" type="email" placeholder="メールアドレス">
    <input class="f-input" type="password" placeholder="パスワード">
    <button class="f-btn">ログイン</button>
  </div>
</section>

<!-- B: きらきら夜空 -->
<section class="scene" id="sceneB">
  <span class="star" style="top:12%;left:14%;font-size:14px;">✦</span>
  <span class="star" style="top:20%;right:18%;font-size:10px;animation-delay:-.8s;">✦</span>
  <span class="star" style="top:32%;left:28%;font-size:8px;animation-delay:-1.6s;">✦</span>
  <span class="star" style="bottom:26%;right:24%;font-size:13px;animation-delay:-.4s;">✦</span>
  <span class="star" style="bottom:14%;left:18%;font-size:9px;animation-delay:-2s;">✦</span>
  <span class="star" style="top:14%;right:38%;font-size:7px;animation-delay:-1.2s;">✦</span>
  <div class="card-base cardB">
    <span class="moon">🌙</span>
    <h2>美容ノート ✳︎</h2>
    <p class="sub">今夜もおつかれさま。今日のケアを記録しよう</p>
    <input class="f-input" type="email" placeholder="メールアドレス">
    <input class="f-input" type="password" placeholder="パスワード">
    <button class="f-btn">ログイン</button>
  </div>
</section>

<!-- C: すっきり水彩 -->
<section class="scene" id="sceneC">
  <div class="arcC1"></div><div class="arcC2"></div>
  <div class="card-base cardC">
    <h2 class="logo-grad">美容ノート<span class="dot"> ✳︎</span></h2>
    <p class="sub">Beauty Note — きれいは、毎日の記録から</p>
    <input class="f-input" type="email" placeholder="メールアドレス">
    <input class="f-input" type="password" placeholder="パスワード">
    <button class="f-btn">ログイン</button>
  </div>
</section>

<!-- D: コスメポップ -->
<section class="scene" id="sceneD">
  <span class="emo" style="top:14%;left:12%;font-size:26px;">💄</span>
  <span class="emo" style="top:11%;right:14%;font-size:22px;animation-delay:-2s;">🌸</span>
  <span class="emo" style="top:36%;right:8%;font-size:18px;animation-delay:-4s;">✨</span>
  <span class="emo" style="bottom:20%;left:10%;font-size:24px;animation-delay:-1s;">🧴</span>
  <span class="emo" style="bottom:12%;right:16%;font-size:22px;animation-delay:-3s;">💅</span>
  <span class="emo" style="top:42%;left:6%;font-size:16px;animation-delay:-5s;">💖</span>
  <div class="card-base cardD">
    <span class="face">🎀</span>
    <h2 class="logo-grad">美容ノート</h2>
    <p class="sub">おかえりなさい！</p>
    <input class="f-input" type="email" placeholder="メールアドレス">
    <input class="f-input" type="password" placeholder="パスワード">
    <button class="f-btn">ログイン ♡</button>
    <p class="foot">きょうも1日おつかれさま 🌷</p>
  </div>
</section>

<script>
function show(id, btn){
  document.querySelectorAll(".scene").forEach(function(s){ s.classList.remove("active"); });
  document.getElementById("scene"+id).classList.add("active");
  document.querySelectorAll(".switcher button").forEach(function(b){ b.classList.remove("active"); });
  btn.classList.add("active");
}
</script>
</body>
</html>
