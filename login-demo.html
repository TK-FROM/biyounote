<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ログイン画面デザイン候補（プレミアム版）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;600&family=Montserrat:wght@400;500&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  body{ font-family:'Zen Kaku Gothic New',system-ui,sans-serif; background:#F2F5F7; }
  .switcher{
    position:fixed; top:0; left:0; right:0; z-index:50;
    display:flex; gap:6px; padding:10px 12px; justify-content:center;
    background:rgba(255,255,255,.88); backdrop-filter:blur(8px);
    box-shadow:0 2px 10px -6px rgba(0,0,0,.2);
  }
  .switcher button{
    border:none; border-radius:999px; padding:8px 18px; font-family:inherit;
    font-size:13px; font-weight:700; cursor:pointer; background:#E9EEF2; color:#5A6B77;
  }
  .switcher button.active{ background:#2E2A2B; color:#fff; }
  .scene{ display:none; min-height:100vh; position:relative; overflow:hidden;
    padding:90px 28px 48px; align-items:center; justify-content:center; }
  .scene.active{ display:flex; animation:fadeUp .5s ease both; }
  @keyframes fadeUp{ from{ opacity:0; transform:translateY(10px); } to{ opacity:1; transform:none; } }
  .inner{ position:relative; z-index:5; width:100%; max-width:320px; }
  .eyebrow{
    font-family:'Montserrat',sans-serif; font-size:10px; letter-spacing:.42em;
    text-transform:uppercase; text-align:center; display:block;
  }
  .wordmark{ font-family:'Shippori Mincho',serif; font-weight:600; text-align:center; }
  .f-btn{
    width:100%; border:none; font-family:inherit; font-size:14px; font-weight:700;
    letter-spacing:.16em; color:#fff; padding:15px; cursor:pointer; border-radius:10px;
    transition:opacity .2s ease;
  }
  .f-btn:active{ opacity:.85; }

  /* ===== 案1: 磁器ホワイト ===== */
  #scene1{ background:#FBF9F7; }
  #scene1::after{
    content:""; position:absolute; top:-140px; right:-120px; width:380px; height:380px; border-radius:50%;
    background:radial-gradient(circle at 40% 40%, rgba(222,168,182,.18), transparent 68%);
  }
  .s1 .eyebrow{ color:#B98A96; margin-bottom:14px; }
  .s1 .wordmark{ font-size:30px; color:#3A3134; letter-spacing:.08em; margin-bottom:20px; }
  .s1 .rule{ width:28px; height:1px; background:#D9C3C9; margin:0 auto 42px; }
  .s1 .field{ margin-bottom:26px; }
  .s1 label{ display:block; font-size:11px; letter-spacing:.12em; color:#A5959B; margin-bottom:7px; }
  .s1 input{
    width:100%; border:none; border-bottom:1px solid #E2D7DA; background:transparent;
    font-family:inherit; font-size:16px; color:#3A3134; padding:7px 2px 11px; border-radius:0;
    transition:border-color .25s ease;
  }
  .s1 input:focus{ outline:none; border-bottom-color:#C4506E; }
  .s1 .f-btn{ background:#C4506E; margin-top:14px; box-shadow:0 14px 28px -16px rgba(196,80,110,.55); }
  .s1 .foot{ font-family:'Montserrat',sans-serif; font-size:9px; letter-spacing:.3em; color:#C9BBC0; text-align:center; margin-top:34px; }

  /* ===== 案2: スパ・グレージュ ===== */
  #scene2{ background:linear-gradient(175deg,#F3EEE8 0%,#EAE3DB 100%); }
  .s2-card{
    background:#FFFFFF; border-radius:18px; padding:44px 30px 38px;
    box-shadow:0 30px 60px -35px rgba(94,78,66,.35);
  }
  .s2 .eyebrow{ color:#B49E85; margin-bottom:12px; }
  .s2 .wordmark{ font-size:27px; color:#38302A; letter-spacing:.1em; margin-bottom:8px; }
  .s2 .tag{ font-size:11px; color:#A79684; text-align:center; letter-spacing:.08em; margin-bottom:34px; }
  .s2 input{
    width:100%; border:1px solid #E7DFD4; background:#FBF9F6; border-radius:10px;
    font-family:inherit; font-size:15px; color:#38302A; padding:13px 14px; margin-bottom:12px;
    transition:border-color .25s ease;
  }
  .s2 input:focus{ outline:none; border-color:#B49E85; }
  .s2 .f-btn{ background:#2E2A28; margin-top:10px; }
  .s2 .gold{ width:34px; height:2px; background:linear-gradient(90deg,#D6BC92,#C0A170); margin:26px auto 0; }

  /* ===== 案3: モード・チャコール ===== */
  #scene3{ background:#1B1719; }
  #scene3::after{
    content:""; position:absolute; bottom:-160px; left:-120px; width:420px; height:420px; border-radius:50%;
    background:radial-gradient(circle at 60% 40%, rgba(158,84,106,.22), transparent 70%);
  }
  .s3 .eyebrow{ color:#8E7A82; margin-bottom:14px; }
  .s3 .wordmark{ font-size:30px; color:#F4EDEF; letter-spacing:.08em; margin-bottom:18px; }
  .s3 .rule{ width:28px; height:1px; background:#9E546A; margin:0 auto 44px; }
  .s3 .field{ margin-bottom:26px; }
  .s3 label{ display:block; font-size:11px; letter-spacing:.12em; color:#8E7A82; margin-bottom:7px; }
  .s3 input{
    width:100%; border:none; border-bottom:1px solid #45383D; background:transparent;
    font-family:inherit; font-size:16px; color:#F4EDEF; padding:7px 2px 11px; border-radius:0;
    transition:border-color .25s ease;
  }
  .s3 input:focus{ outline:none; border-bottom-color:#D98CA4; }
  .s3 .f-btn{ background:#8E3A52; margin-top:14px; }
  .s3 .foot{ font-family:'Montserrat',sans-serif; font-size:9px; letter-spacing:.3em; color:#5C4C52; text-align:center; margin-top:34px; }
</style>
</head>
<body>

<div class="switcher">
  <button class="active" onclick="show(1,this)">1 磁器ホワイト</button>
  <button onclick="show(2,this)">2 グレージュ</button>
  <button onclick="show(3,this)">3 チャコール</button>
</div>

<!-- 案1: 磁器ホワイト -->
<section class="scene active s1" id="scene1">
  <div class="inner">
    <span class="eyebrow">Beauty Note</span>
    <h2 class="wordmark">美容ノート</h2>
    <div class="rule"></div>
    <div class="field">
      <label>メールアドレス</label>
      <input type="email">
    </div>
    <div class="field">
      <label>パスワード</label>
      <input type="password">
    </div>
    <button class="f-btn">ログイン</button>
    <p class="foot">Record Your Glow</p>
  </div>
</section>

<!-- 案2: スパ・グレージュ -->
<section class="scene s2" id="scene2">
  <div class="inner">
    <div class="s2-card">
      <span class="eyebrow">Beauty Note</span>
      <h2 class="wordmark">美容ノート</h2>
      <p class="tag">きれいは、毎日の記録から。</p>
      <input type="email" placeholder="メールアドレス">
      <input type="password" placeholder="パスワード">
      <button class="f-btn">ログイン</button>
      <div class="gold"></div>
    </div>
  </div>
</section>

<!-- 案3: モード・チャコール -->
<section class="scene s3" id="scene3">
  <div class="inner">
    <span class="eyebrow">Beauty Note</span>
    <h2 class="wordmark">美容ノート</h2>
    <div class="rule"></div>
    <div class="field">
      <label>メールアドレス</label>
      <input type="email">
    </div>
    <div class="field">
      <label>パスワード</label>
      <input type="password">
    </div>
    <button class="f-btn">ログイン</button>
    <p class="foot">Record Your Glow</p>
  </div>
</section>

<script>
function show(id, btn){
  document.querySelectorAll(".scene").forEach(function(s){ s.classList.remove("active"); });
  document.getElementById("scene"+id).classList.add("active");
  document.querySelectorAll(".switcher button").forEach(function(b){ b.classList.remove("active"); });
  btn.classList.add("active");
}
</script>
</body>
</html>
