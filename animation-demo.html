<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>記録完了アニメーション候補</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;700;900&display=swap">
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    font-family:'Zen Maru Gothic',system-ui,sans-serif;
    background:#EAF6FB; color:#26323C; padding:24px 16px 60px;
    min-height:100vh;
  }
  h1{
    font-size:20px; font-weight:900; margin-bottom:6px;
    background:linear-gradient(135deg,#FF3E6C,#9B6BFF);
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .lead{ font-size:13px; color:#75858F; margin-bottom:22px; }
  .opt{
    background:#fff; border-radius:18px; padding:16px;
    box-shadow:0 2px 8px -4px rgba(35,55,75,.16); margin-bottom:14px;
  }
  .opt h2{ font-size:15px; font-weight:900; margin-bottom:4px; }
  .opt p{ font-size:12.5px; color:#75858F; margin-bottom:12px; line-height:1.6; }
  .opt button{
    width:100%; border:none; border-radius:12px; padding:12px;
    background:linear-gradient(135deg,#FF3E6C,#9B6BFF); color:#fff;
    font-family:inherit; font-size:14px; font-weight:800; cursor:pointer;
  }
  #overlay{
    position:fixed; inset:0; pointer-events:none; z-index:99; overflow:hidden;
    display:flex; align-items:center; justify-content:center;
  }
</style>
</head>
<body>
<h1>記録完了アニメーション候補</h1>
<p class="lead">それぞれのボタンを押すと、保存完了時の演出をその場で再生します。気に入ったものの記号（A〜D）を教えてください。</p>

<div class="opt">
  <h2>A. 紙吹雪（コンフェッティ）🎊</h2>
  <p>画面中央からカラフルな紙吹雪がぶわっと弾け飛ぶ、お祝いの定番演出。</p>
  <button onclick="confetti()">この演出を再生</button>
</div>

<div class="opt">
  <h2>B. ハート＆キラキラ 💖✨</h2>
  <p>チェックマークがぽんっと出て、まわりからハートとキラキラがふわふわ舞い上がる。</p>
  <button onclick="hearts()">この演出を再生</button>
</div>

<div class="opt">
  <h2>C. 合格スタンプ 💮</h2>
  <p>「記録完了！」のスタンプがドンッと押される。テストで花マルをもらった感じ。</p>
  <button onclick="stamp()">この演出を再生</button>
</div>

<div class="opt">
  <h2>D. 炎の連続記録コンボ 🔥</h2>
  <p>大きな炎が燃え上がって「+1」が飛び出す。連続記録（ストリーク）が伸びる快感を強調。</p>
  <button onclick="flame()">この演出を再生</button>
</div>

<div id="overlay"></div>

<script>
var overlay = document.getElementById("overlay");
function clearOverlay(){ overlay.innerHTML = ""; }

function confetti(){
  clearOverlay();
  var colors = ["#FF3E6C","#9B6BFF","#2FA9DB","#FFC53E","#4ECB8F","#FF8AC2"];
  for(var i=0;i<60;i++){
    var p = document.createElement("div");
    var s = 6 + Math.random()*7;
    p.style.cssText = "position:absolute;left:50%;top:55%;width:"+s+"px;height:"+(s*0.55)+"px;background:"+colors[i%colors.length]+";border-radius:2px;";
    overlay.appendChild(p);
    var ang = Math.random()*Math.PI*2;
    var dist = 90 + Math.random()*240;
    var dx = Math.cos(ang)*dist, dy = Math.sin(ang)*dist - 130;
    p.animate([
      {transform:"translate(0,0) rotate(0deg)", opacity:1},
      {transform:"translate("+dx+"px,"+(dy+260)+"px) rotate("+(Math.random()*720-360)+"deg)", opacity:0}
    ], {duration:1100+Math.random()*500, easing:"cubic-bezier(.15,.55,.35,1)", fill:"forwards"});
  }
  setTimeout(clearOverlay, 1800);
}

function hearts(){
  clearOverlay();
  var check = document.createElement("div");
  check.textContent = "✔";
  check.style.cssText = "position:absolute;left:50%;top:50%;margin:-44px 0 0 -44px;width:88px;height:88px;border-radius:50%;background:linear-gradient(135deg,#FF3E6C,#9B6BFF);color:#fff;font-size:44px;display:flex;align-items:center;justify-content:center;box-shadow:0 12px 30px -8px rgba(255,62,108,.55);";
  overlay.appendChild(check);
  check.animate([
    {transform:"scale(0)", opacity:0},
    {transform:"scale(1.25)", opacity:1, offset:.6},
    {transform:"scale(1)", opacity:1}
  ], {duration:450, easing:"cubic-bezier(.3,1.6,.5,1)", fill:"forwards"});
  var emo = ["💗","💖","✨","🌸","💜","⭐"];
  for(var i=0;i<14;i++){
    (function(i){
      setTimeout(function(){
        var h = document.createElement("div");
        h.textContent = emo[i%emo.length];
        h.style.cssText = "position:absolute;left:50%;top:52%;font-size:"+(16+Math.random()*14)+"px;";
        overlay.appendChild(h);
        var dx = (Math.random()-0.5)*260;
        h.animate([
          {transform:"translate(0,0) scale(.6)", opacity:0},
          {transform:"translate("+(dx*0.4)+"px,-60px) scale(1)", opacity:1, offset:.3},
          {transform:"translate("+dx+"px,-210px) scale(.9)", opacity:0}
        ], {duration:1300, easing:"ease-out", fill:"forwards"});
      }, i*55);
    })(i);
  }
  setTimeout(clearOverlay, 2100);
}

function stamp(){
  clearOverlay();
  var st = document.createElement("div");
  st.innerHTML = "記録完了！<br>💮";
  st.style.cssText = "position:absolute;text-align:center;font-size:34px;font-weight:900;color:#E01E52;border:5px solid #E01E52;border-radius:20px;padding:18px 26px;background:rgba(255,255,255,.92);line-height:1.4;transform:rotate(-8deg);box-shadow:0 14px 34px -12px rgba(224,30,82,.5);";
  overlay.appendChild(st);
  st.animate([
    {transform:"rotate(-8deg) scale(2.6)", opacity:0},
    {transform:"rotate(-8deg) scale(.94)", opacity:1, offset:.55},
    {transform:"rotate(-8deg) scale(1.05)", offset:.75},
    {transform:"rotate(-8deg) scale(1)", opacity:1}
  ], {duration:520, easing:"cubic-bezier(.2,.8,.3,1)", fill:"forwards"});
  setTimeout(function(){
    st.animate([{opacity:1},{opacity:0}], {duration:350, fill:"forwards"});
  }, 1300);
  setTimeout(clearOverlay, 1750);
}

function flame(){
  clearOverlay();
  var ring = document.createElement("div");
  ring.style.cssText = "position:absolute;left:50%;top:50%;margin:-70px 0 0 -70px;width:140px;height:140px;border-radius:50%;border:4px solid #FF7A1A;";
  overlay.appendChild(ring);
  ring.animate([
    {transform:"scale(.4)", opacity:1},
    {transform:"scale(1.7)", opacity:0}
  ], {duration:700, easing:"ease-out", fill:"forwards"});
  var f = document.createElement("div");
  f.textContent = "🔥";
  f.style.cssText = "position:absolute;font-size:88px;filter:drop-shadow(0 10px 24px rgba(255,122,26,.6));";
  overlay.appendChild(f);
  f.animate([
    {transform:"scale(0) translateY(40px)", opacity:0},
    {transform:"scale(1.3) translateY(-6px)", opacity:1, offset:.5},
    {transform:"scale(1) translateY(0)", opacity:1}
  ], {duration:550, easing:"cubic-bezier(.3,1.5,.5,1)", fill:"forwards"});
  var plus = document.createElement("div");
  plus.textContent = "+1";
  plus.style.cssText = "position:absolute;left:50%;top:38%;font-size:30px;font-weight:900;color:#FF7A1A;text-shadow:0 2px 8px rgba(255,122,26,.4);";
  overlay.appendChild(plus);
  plus.animate([
    {transform:"translate(10px,10px) scale(.5)", opacity:0},
    {transform:"translate(30px,-40px) scale(1.15)", opacity:1, offset:.45},
    {transform:"translate(40px,-95px) scale(1)", opacity:0}
  ], {duration:1200, easing:"ease-out", fill:"forwards"});
  setTimeout(clearOverlay, 1900);
}
</script>
</body>
</html>
